name: Build, Test and success CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test 
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Docker
        run: |
          if ! command -v docker &> /dev/null; then
            curl -fsSL https://get.docker.com -o get-docker.sh
            sudo sh get-docker.sh
            sudo usermod -aG docker ubuntu
            newgrp docker
          fi
          sudo chmod 666 /var/run/docker.sock
          sudo docker login -u agkanon -p agkanon@143

      - name: Install UI dependencies
        working-directory: ./frontend
        run: |
          sudo apt update
          sudo apt install -y nginx
          sudo systemctl start nginx
          sudo systemctl enable nginx  
          npm install
          npm run build
          sudo mkdir -p /var/www/bmi-health-tracker
          sudo rm -rf /var/www/bmi-health-tracker/*
          sudo cp -r dist/* /var/www/bmi-health-tracker/
          sudo chown -R www-data:www-data /var/www/bmi-health-tracker
          sudo chmod -R 755 /var/www/bmi-health-tracker
          sudo tee /etc/nginx/sites-available/bmi-health-tracker > /dev/null << 'EOF'
          server {
              listen 80;
              server_name 18.207.1.32; # Replace with your server's IP or domain

              root /var/www/bmi-health-tracker;
              index index.html;

              # React SPA — serve index.html for all non-file routes
              location / {
                  try_files $uri $uri/ /index.html;
              }

              # Proxy API requests to Node.js backend
              location /api/ {
                  proxy_pass http://${{ secrets.EC2_HOST_BACKEND }}:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
              }

              # Security headers
              add_header X-Frame-Options "SAMEORIGIN";
              add_header X-Content-Type-Options "nosniff";
              add_header X-XSS-Protection "1; mode=block";
          }
          EOF
          sudo ln -sf /etc/nginx/sites-available/bmi-health-tracker /etc/nginx/sites-enabled/bmi-health-tracker
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t && sudo systemctl restart nginx

      - name: Deploy DATABASE
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_DATABASE }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Install PostgreSQL only if not already installed
            if ! command -v psql &> /dev/null; then
              echo "PostgreSQL not found. Installing..."
              sudo apt update && sudo apt upgrade -y
              sudo apt install -y postgresql postgresql-contrib
            else
              echo "PostgreSQL already installed. Skipping installation."
            fi

            # Start and enable PostgreSQL if not already running
            if ! sudo systemctl is-active --quiet postgresql; then
              echo "Starting PostgreSQL..."
              sudo systemctl start postgresql
              sudo systemctl enable postgresql
            else
              echo "PostgreSQL is already running. Skipping start."
            fi

            # Create user only if it doesn't exist
            if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='bmi_user'" | grep -q 1; then
              echo "Creating user bmi_user..."
              sudo -u postgres psql -c "CREATE USER bmi_user WITH PASSWORD 'bmi_user';"
            else
              echo "User bmi_user already exists. Skipping."
            fi

            # Create database only if it doesn't exist
            if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='bmidb'" | grep -q 1; then
              echo "Creating database bmidb..."
              sudo -u postgres psql -c "CREATE DATABASE bmidb;"
              sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE bmidb TO bmi_user;"
              sudo -u postgres psql -d bmidb -c "GRANT ALL ON SCHEMA public TO bmi_user;"
              sudo -u postgres psql -d bmidb -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO bmi_user;"
            else
              echo "Database bmidb already exists. Skipping creation."
            fi

            # Clone repo only if not already cloned
            if [ ! -d "3tier-webapp-github-actions" ]; then
              echo "Cloning repository..."
              git clone https://github.com/agkanon/3tier-webapp-github-actions.git
            else
              echo "Repository already exists. Pulling latest changes..."
              cd 3tier-webapp-github-actions && git pull && cd ..
            fi

            # Run migrations (tracked by a marker file to avoid re-running)
            cd 3tier-webapp-github-actions/backend

            if [ ! -f "/var/lib/postgresql/.migration_001_done" ]; then
              echo "Running migration 001..."
              PGPASSWORD=bmi_user psql -U bmi_user -d bmidb -h localhost -f migrations/001_create_measurements.sql
              sudo touch /var/lib/postgresql/.migration_001_done
            else
              echo "Migration 001 already applied. Skipping."
            fi

            if [ ! -f "/var/lib/postgresql/.migration_002_done" ]; then
              echo "Running migration 002..."
              PGPASSWORD=bmi_user psql -U bmi_user -d bmidb -h localhost -f migrations/002_add_measurement_date.sql
              sudo touch /var/lib/postgresql/.migration_002_done
            else
              echo "Migration 002 already applied. Skipping."
            fi

            echo "Database deployment complete."


      - name: Deploy Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_BACKEND }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo apt update && sudo apt upgrade -y
            sudo apt install -y git curl wget unzip build-essential
            git clone https://github.com/agkanon/3tier-webapp-github-actions.git
            cd 3tier-webapp-github-actions/backend
            curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
            sudo apt install -y nodejs
            sudo npm install -g pm2
            node -v && npm -v && pm2 -v
            sudo mkdir -p /opt/bmi-app/backend
            sudo chown -R $USER:$USER /opt/bmi-app
            rsync -a --exclude 'node_modules' --exclude '.env' --exclude 'logs' ~/3tier-webapp-github-actions/backend/ /opt/bmi-app/backend/
            cd /opt/bmi-app/backend
            cat > /opt/bmi-app/backend/.env << EOF
            DATABASE_URL=postgresql://bmi_user:bmi_user@${{ secrets.EC2_HOST_DATABASE }}:5432/bmidb
            DB_USER=bmi_user
            DB_PASSWORD=bmi_user
            DB_NAME=bmidb
            DB_HOST=${{ secrets.EC2_HOST_DATABASE }}
            DB_PORT=5432
            PORT=3000
            NODE_ENV=production
            CORS_ORIGIN=*
            EOF
            chmod 600 /opt/bmi-app/backend/.env
            npm install --production
            pm2 start src/server.js --name bmi-backend --env production
            pm2 save
            sudo env PATH=$PATH:$(which node) $(which pm2) startup systemd -u $USER --hp $HOME
            pm2 save
