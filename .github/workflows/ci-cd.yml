name: Build, Push & Deploy

on:
  push:
    branches: [main]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bmi-backend:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bmi-backend:latest

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bmi-frontend:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bmi-frontend:latest

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MANIFESTS_REPO }}
          token: ${{ secrets.MANIFESTS_REPO_TOKEN }}
          path: manifests

      - run: |
          cd manifests/k8s
          sed -i "s|image: .*bmi-backend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/bmi-backend:${{ env.IMAGE_TAG }}|" backend-deployment.yaml
          sed -i "s|image: .*bmi-frontend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/bmi-frontend:${{ env.IMAGE_TAG }}|" frontend-deployment.yaml

      - run: |
          cd manifests
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend-deployment.yaml k8s/frontend-deployment.yaml
          git commit -m "chore: deploy image tag ${{ env.IMAGE_TAG }}" || echo "No changes to commit"
          git push
