services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: bmidb
      POSTGRES_USER: bmi_user
      POSTGRES_PASSWORD: strongpassword
    volumes:
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmi_user -d bmidb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://bmi_user:strongpassword@db:5432/bmidb
      FRONTEND_URL: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    ports:
      - "2000:80"
    depends_on:
      - backend
